<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/header.css">

    <title>Timo Renken</title>
</head>

<body>
    <header>
        <div>
            <img class="name_logo" src="assets/img/timo_logo.png" alt="">
        </div>
        <div class="links">
            <a href="#">About me</a>
            <a href="#">Skills</a>
            <a href="#">Portfolio</a>
            <div class="set_language">
                <img src="assets/img/de.svg" alt="de">
                <img src="assets/img/en.svg" alt="en">
            </div>
        </div>
    </header>
    <section class="atf">
        <div class="atf_upper">
            <div class="atf_left">
                <img class="hero_img" src="assets/img/atf_timo.png" alt="Timo">
                <img class="shadow_background" src="assets/img/photo_shadows.png" alt="photo shadows">
            </div>
            <div class="atf_right">
                <div class="atf_text">
                    <div class="i_am">I am</div>
                    <div class="name_job">
                        <div class="name">Timo Renken</div>
                        <div class="dev">FRONTEND DEVELOPER</div>
                    </div>
                </div>
                <div class="flex_cc">
                    <a href="#contact" class="btn_lets_talk">
                        <button class="cta-button">Let’s talk!</button>
                    </a>
                </div>
            </div>
            <img class="hero_background" src="assets/img/hero_background.png" alt="hero background">
        </div>
        <div class="atf_under">
            <div class="atf_under_left">
                <div class="line_icons">

                    <div class="atf_under_left_line">
                        <img src="assets/img/purple_line1.svg" alt="purple line">
                    </div>
                    <div class="atf_under_left_icons">
                        <a href="https://github.com/TimoRenken"><img src="assets/img/github_button.svg"
                                alt="github"></a>
                        <a href="mailto:timorenken@outlook.de"><img src="assets/img/email_button.svg" alt="email"></a>
                        <a href="http://linkedin.com/in/timo-renken-b70858349"><img src="assets/img/linkedin_button.svg"
                                alt="linkedin"></a>
                        <a href="mailto:timorenken@outlook.de">timorenken@outlook.de</a>
                    </div>


                </div>

            </div>
            <div class="atf_under_right">
                <img src="assets/img/scroll_down.svg" alt="scroll_down">
            </div>
        </div>
    </section>
</body>

</html>
